# Step 9 of compaction 2: the AWS round that decides the product. Our full kitchen (3-zone log, cook, warm spare,
# optional compactor, data only on S3) in eu-west-1, on machines matching Atlas M30's nodes (2 vCPU, 8 GB), measured
# with the SAME program, harness, data and region as the Atlas Infinite M30 round from Ireland: code-irlanda's
# m30-corto run by kitchen/client.sh unchanged, the founder's script prova_infinite.py unchanged (md5 checked on every
# machine), the Atlas state files (PLANS: SAME before any measurement). Then the separate programs: S3 first byte by
# size, one-trip read of a sealed run, 3-zone log ack, takeovers with 0 lost writes, ballast rounds at 100 GB and 1 TB.
# Everything is explained in step9/README.md; the command fields in step9/ci/decide.py.
#
# The engine: step9/ENGINE names the round's one engine commit (no default; a command may only repeat it); the decide job resolves it, the
# build checks out exactly that commit, and the gate (step9/ci/gate.py) opens only for a local benchmark report made on
# it. Ballast for 100gb/1tb: generated in our stored format by `mongo-server --ballast` (ballast_mode "generate").
# Aurora PostgreSQL in the agent benchmark: "aurora": true (step9/ci/aurora.py, RDS policy in step9/README.md).
# One trigger: a push on branch step9-prep that changes step9/command.json. Modes: "permissions" ($0), "run",
# "teardown", "drop-pantry". A commit that does not change step9/command.json does nothing on AWS.
# No keys: OIDC role from the secret AWS_ROLE_ARN (role fenvix-gha-tests); machines use the role
# fenvix-coldread-machine; tag project=fenvix-coldread and buckets fenvix-coldread-* like M31, Ireland and the minimal
# kitchen, and the same concurrency group (fenvix-m31) on the job "run": never two of them at once.
# RULES.md: a SPESA line every minute, BLOCCO at the cap (5 $ unless the command carries the founder's yes), teardown
# and final check always ("RIMASTO: niente" or ALLARME and a red job). EMERGENCY BRAKE: "Cancel workflow" (the
# teardown still runs).
name: step9-kitchen
on:
  push:
    branches: [step9-prep, 'aws-*']   # aws-*: the branches one OIDC trust condition (StringLike) can cover for good
    paths: ['step9/command.json']
permissions:
  id-token: write
  contents: write
env:
  RUST_TOOLCHAIN: "1.97.0"
jobs:
  decide:
    if: github.repository == 'Mircoguidetti/fenvix-engine'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.c.outputs.mode }}
      engine: ${{ steps.c.outputs.engine }}
      engine_commit: ${{ steps.c.outputs.engine_commit }}
      x86: ${{ steps.c.outputs.x86 }}
      arm: ${{ steps.c.outputs.arm }}
      aurora: ${{ steps.c.outputs.aurora }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: The command (step9/command.json), checked and resolved
        id: c
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          if ! git diff --name-only HEAD~1 HEAD | grep -qx step9/command.json; then echo "mode=none" >> "$GITHUB_OUTPUT"; exit 0; fi
          # the engine the command names: a full commit id (total review R5: never a branch, which moves between the
          # jobs of one round; decide.py refuses anything else). The build checks out exactly this commit, and the gate
          # opens only for a local benchmark report made on it.
          # review of the AWS harness (2026-11-13): the round's ONE engine input is step9/ENGINE (a command may only repeat it)
          ENGINE=$(cd step9/ci && python3 decide.py --engine ../command.json | grep -E '^[0-9a-f]{40}$' || true)
          if [ -n "$ENGINE" ]; then
            export ENGINE_COMMIT=$ENGINE
            echo "engine commit $ENGINE_COMMIT" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          cd step9/ci
          python3 decide.py ../command.json /tmp/resolved.json | tee -a "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.c.outputs.mode != 'none'
        with:
          name: resolved-command
          path: /tmp/resolved.json
          retention-days: 7

  build:
    needs: decide
    if: needs.decide.outputs.mode == 'run'
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            want: ${{ needs.decide.outputs.x86 }}
          - arch: aarch64
            runner: ubuntu-24.04-arm
            want: ${{ needs.decide.outputs.arm }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        if: matrix.want == '1'
        with:
          ref: ${{ needs.decide.outputs.engine_commit }}
          persist-credentials: false
      # the harness (this workflow's own commit) for its build script: the engine checkout above has none
      - uses: actions/checkout@v4
        if: matrix.want == '1'
        with:
          path: harness
          persist-credentials: false
      - name: Build mongo-server and pq (the log) for ${{ matrix.arch }}, Ubuntu 24.04 like the machines (reproducible recipe)
        if: matrix.want == '1'
        run: |
          command -v rustup >/dev/null || { curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none; echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"; export PATH="$HOME/.cargo/bin:$PATH"; }
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          [ "$(uname -m)" = "${{ matrix.arch }}" ] || { echo "::error::runner is $(uname -m)"; exit 1; }
          [ "$(git rev-parse HEAD)" = "${{ needs.decide.outputs.engine_commit }}" ] || { echo "::error::checked out $(git rev-parse HEAD), not the resolved engine commit"; exit 1; }
          # step9/ci/build-engine.sh: one fixed folder + --remap-path-prefix, so the same commit gives the same bytes as
          # the local round's build (fenvix-tests 0ff5bc2); out/build-ARCH.json carries the sha256
          bash harness/step9/ci/build-engine.sh "$PWD" "${{ needs.decide.outputs.engine_commit }}" out > build.log 2>&1 || { tail -40 build.log; exit 1; }
          tail -9 build.log
          echo "build ${{ matrix.arch }}: commit $(cat out/mongo-server-${{ matrix.arch }}/motore-commit.txt), mongo-server $(sha256sum out/mongo-server-${{ matrix.arch }}/mongo-server | cut -c1-16), pq $(sha256sum out/pq-${{ matrix.arch }}/pq | cut -c1-16)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: matrix.want == '1'
        with:
          name: bin-${{ matrix.arch }}
          path: out/
          retention-days: 1

  run:
    needs: [decide, build]
    if: always() && needs.decide.outputs.mode != 'none' && needs.decide.outputs.mode != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    concurrency:
      group: fenvix-m31
      cancel-in-progress: false
    env:
      AWS_PAGER: ""
      AWS_DEFAULT_REGION: eu-west-1
      AWS_REGION: eu-west-1
      CM_ROLE: ${{ secrets.AWS_ROLE_ARN }}
      MODE: ${{ needs.decide.outputs.mode }}
      S9_AURORA: ${{ needs.decide.outputs.aurora }}
      S9_MODE: aws
      RUN_ID: ${{ github.run_id }}
      RESOLVED: /tmp/resolved/resolved.json
      MACHINE_ROLE: fenvix-coldread-machine
      DISK_GB: "20"
      CA_DIR: /tmp/ca
      PACKAGES: /tmp/packages
      OUT: /tmp/s9-out
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: resolved-command
          path: /tmp/resolved
      - name: Mask account and role; the password of the round (new, masked); Python libraries
        run: |
          [ -n "$CM_ROLE" ] || { echo "secret AWS_ROLE_ARN missing"; exit 1; }
          acct=$(cut -d: -f5 <<<"$CM_ROLE"); echo "::add-mask::$acct"; echo "::add-mask::${CM_ROLE##*/}"
          pw=$(openssl rand -hex 24); echo "::add-mask::$pw"
          { echo "CM_ACCT=$acct"; echo "CM_PW=$pw"; echo "CM_START=$(date -u -d '2 minutes ago' +%FT%TZ)"; } >> "$GITHUB_ENV"
          python3 -m pip install -q --user boto3 'pymongo>=4.6,<5'   # pymongo: the ballast plan imports the founder's script
      - name: Did the build work? (run only)
        if: env.MODE == 'run'
        run: '[ "${{ needs.build.result }}" = success ] || { echo "::error::build: ${{ needs.build.result }}"; exit 1; }'
      - uses: actions/download-artifact@v4
        if: env.MODE == 'run'
        with:
          pattern: bin-*
          path: /tmp/bin
          merge-multiple: true
      - name: AWS credentials (OIDC, 1 h)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1
          role-duration-seconds: 3600
          mask-aws-account-id: true
      - name: The password of a kept pantry (its root user was made by the round that created it)
        if: env.MODE == 'run'
        run: |
          [ "$(python3 step9/machine/cfg.py "$RESOLVED" pantry_mode)" = existing ] || { echo "new pantry: new password"; exit 0; }
          p=$(python3 step9/machine/cfg.py "$RESOLVED" pantry_name)
          pw=$(aws s3 cp "s3://$p/step9-secret/pw" -) && [ -n "$pw" ] || { echo "no password in the kept pantry $p"; exit 1; }
          echo "::add-mask::$pw"; echo "CM_PW=$pw" >> "$GITHUB_ENV"
      - name: The pantry's writing mark (a job that reads the pantry as loaded is refused once a writing program ran)
        if: env.MODE == 'run'
        run: cd step9/ci && python3 decide.py --pantry-check "$RESOLVED" | tee -a "$GITHUB_STEP_SUMMARY"; exit "${PIPESTATUS[0]}"
      - name: Permissions and vCPU quota ($0)
        if: env.MODE == 'permissions' || env.MODE == 'run'
        run: bash step9/ci/permissions.sh
      - name: Aurora permissions ($0, no cluster is created; only when the command has "aurora" true)
        if: (env.MODE == 'permissions' || env.MODE == 'run') && env.S9_AURORA == '1'
        run: python3 step9/ci/aurora.py permissions "$RUN_ID"
      - name: Atlas state files (code-irlanda, CATENA checked) and packages (no AWS)
        if: env.MODE == 'run'
        run: |
          bash kitchen/ci/atlas_states.sh "$(python3 step9/machine/cfg.py "$RESOLVED" atlas_states)" /tmp/atlas-states.tar.gz m10p m10s m30p m30s vecchio | tee -a "$GITHUB_STEP_SUMMARY"
          PANTRY=$(python3 step9/machine/cfg.py "$RESOLVED" pantry_name)
          LOAD=$(python3 -c "import json,sys; print(1 if json.load(open(sys.argv[1]))['atlas_load'] else 0)" "$RESOLVED")
          # the MongoDB line (phase "mongod", aws-local-round): MongoDB's official mongod 7.0.48 for Ubuntu 22.04 x86_64 (it
          # runs on the Ubuntu 24.04 image: MEASURED locally with the same version's binary); the sha256 is printed
          if python3 -c "import json,sys; sys.exit(0 if 'mongod' in json.load(open(sys.argv[1]))['phases'] else 1)" "$RESOLVED"; then
            export MONGOD_TGZ_URL=https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2204-7.0.48.tgz
          fi
          S9=step9 K=kitchen BIN=/tmp/bin ATLAS_TGZ=/tmp/atlas-states.tar.gz PANTRY="$PANTRY" LOAD="$LOAD" WAIT_COOK_MIN=600 bash step9/ci/packages.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The round (log, load, measured kitchen, m30 program, extras; SPESA every minute, BLOCCO at the cap)
        id: run
        if: env.MODE == 'run'
        continue-on-error: true
        run: python3 step9/ci/run.py "$RESOLVED" "$OUT"
      - name: Credentials for the teardown
        if: always()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1
          role-duration-seconds: 3600
          mask-aws-account-id: true
      - name: Teardown (tagged machines, buckets fenvix-coldread-*, security groups; a kept pantry stays)
        if: always()
        run: python3 step9/ci/teardown.py aws
      - name: Drop the kept pantry (mode drop-pantry only)
        if: env.MODE == 'drop-pantry'
        run: |
          p=$(python3 step9/machine/cfg.py "$RESOLVED" pantry)
          [[ "$p" =~ ^fenvix-kitchen-pantry-[0-9]+$ ]] || { echo "not a kept pantry: $p"; exit 1; }
          aws s3 rb "s3://$p" --force && echo "kept pantry deleted: $p"
      - name: No secret in the results (otherwise nothing is published)
        id: secrets
        if: always() && env.MODE == 'run'
        run: |
          [ -d "$OUT" ] || { echo "no results"; exit 0; }
          grep -rl "$CM_ACCT" "$OUT" 2>/dev/null | xargs -r sed -i "s/$CM_ACCT/<ACCOUNT_ID>/g"
          python3 kitchen/ci/check_secrets.py "$OUT"
          echo "clean=1" >> "$GITHUB_OUTPUT"
      - name: Publish the results on the branch (files over 90 MB stay in the artifact)
        if: always() && steps.secrets.outputs.clean == '1'
        run: |
          R=step9/results/run-${{ github.run_id }}
          mkdir -p "$R" && cp -r "$OUT"/. "$R"/ && find "$R" -name .pushed.json -delete && find "$R" -type f -size +90M -delete
          git config user.name github-actions; git config user.email actions@users.noreply.github.com
          git add "$R" && git commit -qm "Step 9 round ${{ github.run_id }}: results" || true
          for _ in 1 2 3; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
      - uses: actions/upload-artifact@v4
        if: always() && steps.secrets.outputs.clean == '1'
        with:
          name: step9-results-${{ github.run_id }}
          path: /tmp/s9-out
          if-no-files-found: ignore
          retention-days: 14
      - name: Fresh credentials for the final check
        if: always()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1
          role-duration-seconds: 900
          mask-aws-account-id: true
      - name: Final check - RIMASTO niente, or ALLARME and a red job
        if: always()
        run: python3 step9/ci/final_check.py aws "$CM_START"
      - name: Outcome of the round
        if: always() && env.MODE == 'run'
        run: '[ "${{ steps.run.outcome }}" = success ]'
