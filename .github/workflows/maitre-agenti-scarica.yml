# M18: scarica le tracce pubbliche degli agenti di DAB (UC Berkeley, Google Drive), estrae solo le chiamate al
# database e fa commit del file compresso su questo branch. Niente segreti, niente AWS, meno di 120 minuti.
name: maitre-agenti-scarica
on:
  push:
    branches: [maitre-agenti]
    paths: ['proto/maitre-agenti/tracce/scarica.json']
permissions:
  contents: write
jobs:
  scarica:
    if: github.repository == 'Mircoguidetti/fenvix-engine'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: scarica da Google Drive
        run: |
          set -x
          pip install --quiet gdown
          ID=$(python3 -c "import json;print(json.load(open('proto/maitre-agenti/tracce/scarica.json'))['drive_id'])")
          mkdir -p /tmp/dab && cd /tmp/dab
          gdown --fuzzy "https://drive.google.com/file/d/$ID/view" -O dab.bin || gdown --folder "https://drive.google.com/drive/folders/$ID" -O dabdir
          ls -la /tmp/dab; file /tmp/dab/* || true
      - name: estrai
        run: |
          cd /tmp/dab
          mkdir -p x
          if [ -f dab.bin ]; then
            case "$(file -b dab.bin)" in
              Zip*) unzip -q dab.bin -d x ;;
              *gzip*) tar xzf dab.bin -C x ;;
              *XZ*) tar xJf dab.bin -C x ;;
              *bzip2*) tar xjf dab.bin -C x ;;
              *tar*) tar xf dab.bin -C x ;;
              *7-zip*) sudo apt-get install -y p7zip-full >/dev/null; 7z x dab.bin -ox >/dev/null ;;
              *) echo "formato sconosciuto"; file dab.bin ;;
            esac
          else
            cp -r dabdir/* x/ || true
          fi
          # archivi dentro l'archivio
          find x -name '*.zip' -exec sh -c 'unzip -q -o "$1" -d "${1%.zip}"' _ {} \; || true
          find x \( -name '*.tar.gz' -o -name '*.tgz' \) -exec sh -c 'mkdir -p "$1.d" && tar xzf "$1" -C "$1.d"' _ {} \; || true
          du -sh x
          OUT=$GITHUB_WORKSPACE/proto/maitre-agenti/tracce
          (cd x && find . -type d | head -3000) > $OUT/dab-elenco-cartelle.txt
          (cd x && find . -type f | sed 's#.*/##' | sort | uniq -c | sort -rn | head -50) > $OUT/dab-tipi-file.txt
          python3 $GITHUB_WORKSPACE/proto/maitre-agenti/estrai_dab.py x $OUT/dab-chiamate.jsonl.gz > $OUT/dab-estrazione.json
          cat $OUT/dab-estrazione.json; ls -la $OUT
          # un campione di final_agent.json per capire il formato
          F=$(find x -name final_agent.json | head -1); [ -n "$F" ] && head -c 20000 "$F" > $OUT/dab-campione-final_agent.txt || true
          F=$(find x -name tool_calls.jsonl | head -1); [ -n "$F" ] && head -c 20000 "$F" > $OUT/dab-campione-tool_calls.txt || true
      - name: commit
        run: |
          cd $GITHUB_WORKSPACE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proto/maitre-agenti/tracce
          git commit -m "M18: tracce DAB estratte dal runner (solo chiamate al database)" || exit 0
          git push
