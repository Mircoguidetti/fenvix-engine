SPECIFICATION Spec
CONSTANTS
  Replicas = {r1, r2, r3}
  Keys = {k1, k2, k3}
  Txns = {t1, t2, t3}
  r1 = r1
  r2 = r2
  r3 = r3
  k1 = k1
  k2 = k2
  k3 = k3
  t1 = t1
  t2 = t2
  t3 = t3
  Deps <- MCDeps
  Writes <- MCWrites
  MaxEpoch = 2
  MaxAttempts = 2
  MaxLoss = 1
  NoValidate = TRUE
  NoRebuild = FALSE
  AcceptOldS = FALSE
  AckOnOne = FALSE
  NoVoteRestriction = FALSE
  RetryBeyondWindow = FALSE
SYMMETRY Sym
INVARIANTS NoConflictingCommits
PROPERTIES CommitMonotonic
