# Cliente Rust (driver ufficiale `mongodb`) per la prova M14. Progetto a parte, fuori dal workspace del motore.
[workspace]

[package]
name = "client-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
mongodb = "3"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
rand = "0.8"
futures = "0.3"
