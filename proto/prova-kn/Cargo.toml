[package]
name = "prova-kn"
version = "0.1.0"
edition = "2021"
description = "M10: letture k su n (codici a cancellazione) contro lettura normale e richiesta doppia, su un finto S3 con coda lunga"

# crate autonomo: non fa parte del workspace del motore
[workspace]

[dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
object_store = { version = "=0.14.2", features = ["aws"] }
futures = "0.3"
anyhow = "1"
rand = { version = "0.8", features = ["small_rng"] }
rand_distr = "0.4"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
reed-solomon-simd = "3"
hdrhistogram = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
parking_lot = "0.12"
libc = "0.2"

[profile.release]
debug = 1
