[package]
name = "milione"
version = "0.1.0"
edition = "2021"
description = "Prova P1, un milione di fogli: un cameriere con LRU dei database aperti sopra proto-lettura (variante a2)"

# crate autonomo: non fa parte del workspace del motore
[workspace]

[dependencies]
lettura = { path = "../lettura" }
tokio = { version = "1", features = ["full"] }
bytes = "1"
object_store = { version = "=0.14.2", features = ["aws"] }
anyhow = "1"
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bson = "2"
hdrhistogram = "7"
parking_lot = "0.12"
clap = { version = "4", features = ["derive"] }
lru = "0.12"
pbkdf2 = "0.12"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
libc = "0.2"
hex = "0.4"
futures = "0.3"
crc32fast = "1"

[profile.release]
debug = 1
