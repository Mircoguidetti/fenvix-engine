[package]
name = "m31"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
slatedb = { version = "=0.17.0", features = ["foyer", "wal_disable", "lz4", "zstd"] }
object_store = { version = "=0.14.2", features = ["aws"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
bytes = "1"
futures = "0.3"
rand = { version = "0.8", features = ["small_rng"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
libc = "0.2"
lz4_flex = "0.11.5"
zstd = "0.13.2"
ulid = "1.2.1"


[profile.release]
debug = false
