[package]
name = "misura-lettore"
version = "0.1.0"
edition = "2021"
description = "N3: µs per lettura puntuale del lettore di proto-lettura (blocchi in RAM, senza TCP) contro Db::get di SlateDB 0.17"

# crate autonomo: non fa parte del workspace del motore
[workspace]

[dependencies]
lettura = { path = "../lettura" }
slatedb = "=0.17.0"
object_store = { version = "=0.14.2", features = ["aws"] }
tokio = { version = "1", features = ["full"] }
bytes = "1"
anyhow = "1"
rand = { version = "0.8", features = ["small_rng"] }
serde_json = "1"
hdrhistogram = "7"
clap = { version = "4", features = ["derive"] }

[profile.release]
debug = 1
