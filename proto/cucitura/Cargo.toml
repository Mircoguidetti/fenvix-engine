[package]
name = "cucitura"
version = "0.1.0"
edition = "2021"
description = "Prototipo M11: lavaggio a cucitura (compattazione che copia lato server i tratti che non si sovrappongono)"

# crate autonomo: non fa parte del workspace del motore
[workspace]

[dependencies]
lettura = { path = "../lettura" }
tokio = { version = "1", features = ["full"] }
bytes = "1"
anyhow = "1"
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hdrhistogram = "7"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
crc32fast = "1"
futures = "0.3"
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest", "default-https-client"] }
aws-smithy-types = "1"
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }

[profile.release]
debug = 1
