[package]
name = "quaderno"
version = "0.1.0"
edition = "2021"
description = "Prototipo del registro senza cuoco: 3 repliche, un leader, finestra di 60 s indicizzata per chiave"

# crate autonomo: non fa parte del workspace del motore
[workspace]

[dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
crc32fast = "1"
crossbeam-channel = "0.5"
parking_lot = "0.12"
hdrhistogram = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rand = "0.8"
libc = "0.2"
object_store = { version = "0.11", features = ["aws"] }
futures = "0.3"
zstd = "0.13"
tikv-jemallocator = { version = "0.6", features = ["background_threads"] }
hashbrown = "0.15"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4
