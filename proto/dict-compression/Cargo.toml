[package]
name = "dict-compression"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
zstd = { version = "0.13.2", features = ["experimental", "zdict_builder"] }
lz4_flex = "0.11.5"
bson = "2"
rand = { version = "0.8", features = ["small_rng"] }
rand_distr = "0.4"
serde_json = "1"
flate2 = "1"
chrono = "0.4"

[profile.release]
debug = false
lto = true
codegen-units = 1
