[package]
name = "lettura"
version = "0.1.0"
edition = "2021"
description = "Prototipo senza cuoco, parte S3: scarico da chiunque, SST su S3, lettura composta SST + finestra del registro"

# crate autonomo: non fa parte del workspace del motore
[workspace]

[dependencies]
tokio = { version = "1", features = ["full"] }
bytes = { version = "1", features = ["serde"] }
object_store = { version = "=0.14.2", features = ["aws"] }
futures = "0.3"
async-trait = "0.1"
anyhow = "1"
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
crc32fast = "1"
hdrhistogram = "7"
parking_lot = "0.12"
clap = { version = "4", features = ["derive"] }
lru = "0.12"
libc = "0.2"
hex = "0.4"

[profile.release]
debug = 1
