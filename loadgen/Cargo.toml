[package]
name = "loadgen"
version = "0.1.0"
edition = "2021"

[dependencies]
mongodb = "=3.9.1"
tokio = { version = "=1.54.1", features = ["full"] }
hdrhistogram = "=7.6.0"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
futures = "0.3"
anyhow = "1"
