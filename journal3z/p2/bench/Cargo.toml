[package]
name = "j3z-bench"
version = "0.1.0"
edition = "2021"
description = "journal3z local test bench: real processes (3 nodes, writers, MinIO, fault proxy), load client, checker"

[dependencies]
journal3z-core = { workspace = true }
j3z-writer = { path = "../writer", features = ["mutations"] }
j3z-net = { path = "../net" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
object_store = { version = "=0.14.2", features = ["aws"] }

[dev-dependencies]
tempfile = "3"
