[package]
name = "j3z-store"
version = "0.1.0"
edition = "2021"
description = "Disk format of a journal3z node: CRC-framed segments, fence table, node identity, recovery"

[dependencies]
journal3z-core = { workspace = true }
j3z-codec = { path = "../codec" }
rand = { workspace = true }

[features]
# Test-only store bugs (TestBugs) and the record generator; never enabled in the node's production build.
testbugs = []

[[test]]
name = "recovery"
required-features = ["testbugs"]

[[bin]]
name = "j3z-killchild"
path = "src/bin/j3z-killchild.rs"
required-features = ["testbugs"]

[dev-dependencies]
bytes = { workspace = true }
tempfile = "3"
