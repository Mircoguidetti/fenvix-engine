[package]
name = "j3z-harness"
version = "0.1.0"
edition = "2021"
description = "Common test bed for the journal3z spikes: delay line, fdatasync'd group-commit files, closed-loop driver, CPU/RSS"

[workspace]

[dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
rand = "0.8"
anyhow = "1"
futures = "0.3"
