[package]
name = "spike-openraft"
version = "0.1.0"
edition = "2021"
description = "journal3z library spike: openraft 0.9 on the common test bed (delay line, fdatasync'd LogFile per node)"

[workspace]

[dependencies]
j3z-harness = { path = "../harness" }
openraft = { version = "=0.9.25", features = ["storage-v2"] }
tokio = { version = "1", features = ["full"] }
bytes = "1"
anyhow = "1"
futures = "0.3"
serde_json = "1"

[profile.release]
debug = false
