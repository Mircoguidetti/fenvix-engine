[package]
name = "spike-proto"
version = "0.1.0"
edition = "2021"
description = "Reference: the walbench quorum write path (send to 3, fdatasync, ack at 2 of 3; no epochs) on the common test bed"

[workspace]

[dependencies]
j3z-harness = { path = "../harness" }
tokio = { version = "1", features = ["full"] }
bytes = "1"
anyhow = "1"
futures = "0.3"
serde_json = "1"

[profile.release]
debug = false
