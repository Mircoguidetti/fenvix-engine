[package]
name = "spike-raftrs"
version = "0.1.0"
edition = "2021"
description = "Spike: raft-rs (tikv `raft` crate) on the common journal3z test bed"

[workspace]

[dependencies]
j3z-harness = { path = "../harness" }
raft = { version = "=0.7.0", default-features = false, features = ["protobuf-codec"] }
slog = "2"
protobuf = { version = "=2.28.0", features = ["bytes"] }
tokio = { version = "1", features = ["full"] }
bytes = "1"
anyhow = "1"
futures = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[profile.release]
debug = false
