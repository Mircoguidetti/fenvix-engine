[package]
name = "spike-custom"
version = "0.1.0"
edition = "2021"
description = "journal3z protocol core (journal3z/core) in real time on the common test bed: 3 nodes, fdatasync, delay line"

[workspace]

[dependencies]
j3z-harness = { path = "../harness" }
journal3z-core = { path = "../../core" }
tokio = { version = "1", features = ["full"] }
bytes = "1"
anyhow = "1"
futures = "0.3"
serde_json = "1"

[profile.release]
debug = false
