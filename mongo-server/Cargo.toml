[package]
name = "mongo-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tenant-bench = { path = ".." }
slatedb = "=0.17.0"
object_store = { version = "=0.14.2", features = ["aws"] }
bson = { version = "=3.1.0", features = ["serde", "serde_json-1"] }
fancy-regex = "=0.20.0"
rquickjs = "0.14.0"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
rust-stemmers = "1"
unicode-normalization = "0.1"
s2 = "0.2"
async-trait = "0.1"
tokio = { version = "=1.54.1", features = ["full"] }
anyhow = "1"
bytes = "1"
futures = "0.3"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
md-5 = "0.11"
