[package]
name = "mongo-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tenant-bench = { path = ".." }
slatedb = "=0.17.0"
object_store = { version = "=0.14.2", features = ["aws"] }
bson = "=3.1.0"
tokio = { version = "=1.54.1", features = ["full"] }
anyhow = "1"
bytes = "1"
futures = "0.3"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
