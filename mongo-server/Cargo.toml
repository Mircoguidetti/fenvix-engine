[package]
name = "mongo-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tenant-bench = { path = ".." }
# the replicated log (3 copies, 2 of 3 to confirm), client side: proto/quaderno
quaderno = { path = "../proto/quaderno" }
slatedb = "=0.17.0"
object_store = { version = "=0.14.2", features = ["aws"] }
# the sweep of unfinished multipart uploads (uploads.rs): the same reqwest object_store uses, no new crate
reqwest = { version = "=0.13.5", default-features = false }
bson = { version = "=3.1.0", features = ["serde", "serde_json-1"] }
fancy-regex = "=0.20.0"
rquickjs = "0.14.0"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# exact comparison of Decimal128 with other numbers (fix-query-defects P8); the version already in Cargo.lock
bigdecimal = "=0.4.11"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
rust-stemmers = "1"
unicode-normalization = "0.1"
s2 = "0.2"
async-trait = "0.1"
uuid = "1"
tokio = { version = "=1.54.1", features = ["full"] }
anyhow = "1"
libc = "0.2"
bytes = "1"
http = "1"
futures = "0.3"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
hmac = "0.13"
pbkdf2 = { version = "0.13", features = ["hmac"] }
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1"
x509-parser = "0.17"
icu_collator = "2"
icu_locale = "2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
snap = "1"
zstd = "0.13"
tikv-jemallocator = { version = "=0.6.0", features = ["stats"] }
tikv-jemalloc-ctl = { version = "=0.6.0", features = ["stats"] }
# Measurement builds only (`--features cpu-prof`): a SIGPROF sampling CPU profiler, no perf_event needed (see main.rs)
pprof = { version = "=0.15.0", optional = true, default-features = false }

[features]
# Measurement builds only: jemalloc's heap profiler (`_RJEM_MALLOC_CONF=prof:true,...` and HEAP_PROF_DUMP_SECS, see main.rs).
heap-prof = ["tikv-jemallocator/profiling"]
# Measurement builds only: CPU_PROF_FILE=path, then SIGUSR2 starts a CPU profile (997 Hz) and a second SIGUSR2 writes
# it as folded stacks (one "frame;frame;... count" line per stack) to that path.
cpu-prof = ["dep:pprof"]
