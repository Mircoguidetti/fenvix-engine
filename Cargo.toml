[package]
name = "tenant-bench"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["mongo-server", "loadgen"]

[dependencies]
slatedb = "=0.17.0"
foyer = "=0.22.6"
object_store = { version = "=0.14.2", features = ["aws"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
bytes = "1"
futures = "0.3"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bincode = "1.3"
libc = "0.2"

[dev-dependencies]
ulid = "=1.2.1"

[profile.release]
debug = false
