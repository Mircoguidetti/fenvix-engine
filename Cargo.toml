[package]
name = "tenant-bench"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["mongo-server", "loadgen"]
# the log (quaderno) crate is its own workspace; mongo-server uses it as a path dependency
exclude = ["proto"]

[dependencies]
slatedb = { version = "=0.17.0", features = ["lz4", "zstd", "compaction_filters"] }
foyer = "=0.22.6"
object_store = { version = "=0.14.2", features = ["aws"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
bytes = "1"
futures = "0.3"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bincode = "1.3"
libc = "0.2"
ulid = "=1.2.1"
crc32c = "=0.6.9"
twox-hash = "=2.1.5"
lz4_flex = "=0.11.6"
uuid = "1"

[dev-dependencies]
ulid = "=1.2.1"

[profile.release]
debug = false
